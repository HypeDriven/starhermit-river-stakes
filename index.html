<!DOCTYPE html>
<html lang="en" data-theme="river">
<head>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>River Stakes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='4' width='52' height='56' rx='9' fill='%23f6efdd'/%3E%3Cpath d='M6 38c7-7 13 7 20 0s13 7 20 0 12 7 12 7v6a9 9 0 0 1-9 9H15a9 9 0 0 1-9-9z' fill='%232f6f8f'/%3E%3Cpath d='M32 12c5 7 9 9 9 14a9 9 0 0 1-18 0c0-5 4-7 9-14z' fill='%231d3b2a'/%3E%3Crect x='29.5' y='30' width='5' height='8' rx='2' fill='%231d3b2a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<style>
/* Minimal boot styles to avoid FOUC; the real design lives in css/style.css */
html,body{margin:0;height:100%;background:var(--bg,#14261d);color:var(--ink,#f3ecd9);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0}
.visually-hidden{position:absolute!important;width:1px;height:1px;margin:-1px;
  padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div id="ui"></div>
<div id="live-polite" class="visually-hidden" role="status" aria-live="polite"></div>
<div id="live-assertive" class="visually-hidden" role="alert" aria-live="assertive"></div>
<noscript>
  <p style="padding:2rem;max-width:38rem">River Stakes is a browser card game and needs
  JavaScript to run. Please enable JavaScript and reload the page.</p>
</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
